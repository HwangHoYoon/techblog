spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/techblog
    username: techblog
    password: techblog
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
          github:
            client-id: YOUR_GITHUB_CLIENT_ID
            client-secret: YOUR_GITHUB_CLIENT_SECRET

jwt:
  secret: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LXdoaWNoLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
  access-token-expiration: 1800000 # 30 minutes
  refresh-token-expiration: 1209600000 # 14 days

security:
  permit-all:
    - /api/auth/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

  get-permit-all:
    - /api/posts/**
    - /api/users/**

cors:
  allowed-origins:
    - http://localhost:3000

  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS

  allowed-headers:
    - "*"

  allow-credentials: true